name: Build Windows .exe

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inštalácia závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Spustenie testov
        run: PYTHONPATH=src python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inštalácia závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build .exe (PyInstaller)
        run: pyinstaller build/volby_dekana.spec --noconfirm
      - name: Inštalácia Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build inštalátora (Inno Setup)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss'
      - name: Nahranie aplikácie (priečinok)
        uses: actions/upload-artifact@v4
        with:
          name: VolbyDekana-app
          path: dist/VolbyDekana/
      - name: Nahranie inštalátora
        uses: actions/upload-artifact@v4
        with:
          name: VolbyDekana-Setup
          path: dist/VolbyDekana-Setup-*.exe
