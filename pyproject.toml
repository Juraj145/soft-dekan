[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volby-dekana"
version = "0.7.0"
description = "Desktopová aplikácia pre voľby kandidáta na dekana TF SPU v Nitre"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1,<2"]

[project.scripts]
volby-dekana = "volby_dekana.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volby_dekana = ["assets/*"]
